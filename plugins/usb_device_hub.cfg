[USB_DEVICE_DESCRIPTOR]
bLength                = 0x12
bDescriptorType        = 0x01
bcdUSB                 = 0x0200  ; USB 2.0
bDeviceClass           = 0x09    ; Hub
bDeviceSubClass        = 0x00
bDeviceProtocol        = 0x00    ; Full speed (ou 0x01 pour hub haute vitesse)
bMaxPacketSize0        = 0x40    ; 64 bytes
idVendor               = 0x1234  ; Exemple: Vendor ID
idProduct              = 0x5678  ; Exemple: Product ID
bcdDevice              = 0x0100  ; Version du device
iManufacturer          = 0x01    ; Index de la chaîne "Manufacturer"
iProduct               = 0x02    ; Index de la chaîne "Product"
iSerialNumber          = 0x03    ; Index de la chaîne "Serial Number"
bNumConfigurations     = 0x01
